[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fnirz"]
namespaces = false


[project]
name = "fnirz"
version = "0.0.1"
authors = [
  { name="Demetris Roumis" },
]
description = "fnirs visualization tools"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/droumis/fnirz"
"Bug Tracker" = "https://github.com/droumis/fnirz/issues"